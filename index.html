<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Chapter 3 Interest Rates MCQ Quiz</title>
<style>
*{box-sizing:border-box}body{margin:0;padding:18px;font-family:Arial,sans-serif;background:#f3f6fb;color:#172033}.wrap{max-width:900px;margin:auto}header,.question,.results{background:#fff;padding:20px;border-radius:14px;margin-bottom:15px;box-shadow:0 4px 14px #17203312}h1{font-size:1.55rem;margin:0 0 8px}.muted{color:#64748b;line-height:1.5}.progress{height:8px;background:#e2e8f0;border-radius:8px;overflow:hidden;margin-top:10px}.bar{height:100%;background:#2563eb;width:0}.qtitle{font-weight:bold;line-height:1.45;margin-bottom:12px}.option{display:flex;align-items:flex-start;gap:10px;padding:12px;border:1px solid #dbe3ef;border-radius:10px;margin:8px 0;cursor:pointer;line-height:1.4}.option:hover{background:#f8fafc}.option input{margin-top:3px;accent-color:#2563eb}.option.correct{border-color:#16a34a;background:#f0fdf4}.option.incorrect{border-color:#dc2626;background:#fef2f2}.mark{margin-left:auto;font-weight:bold;white-space:nowrap}.green{color:#15803d}.red{color:#b91c1c}button{border:0;border-radius:10px;padding:12px 17px;background:#2563eb;color:#fff;font-weight:bold;font-size:1rem;cursor:pointer;margin:4px 6px 4px 0}button.secondary{background:#475569}button:disabled{opacity:.5;cursor:default}.hidden{display:none}.score{font-size:1.35rem;font-weight:bold}.resultrow{padding:13px 0;border-top:1px solid #e2e8f0;line-height:1.5}.pill{display:inline-block;border-radius:20px;padding:5px 10px;font-size:.85rem;font-weight:bold}.pass{background:#dcfce7;color:#166534}.fail{background:#fee2e2;color:#991b1b}@media(max-width:560px){body{padding:9px}header,.question,.results{padding:14px}.mark{font-size:.8rem}}
</style></head><body><div class="wrap"><header><h1>Chapter 3: Interest Rates and Valuation</h1><p class="muted">30 reviewed multiple-choice questions based on your PowerPoint. Select one answer per question, then submit to see your score, correct answers, and explanations. Green ✓ marks correct answers; red ✗ marks incorrect selections.</p><div id="progressText" class="muted">0 of 30 answered</div><div class="progress"><div id="bar" class="bar"></div></div></header><form id="quiz"></form><button type="button" id="submitBtn">Submit Quiz &amp; Show Answers</button><button type="button" class="secondary" id="resetBtn">Reset Quiz</button><section id="results" class="results hidden" aria-live="polite"></section></div>
<script>
const questions=[{"q": "What is the most accurate measure of an interest rate for a debt instrument according to the chapter?", "options": ["Coupon rate", "Yield to maturity (YTM)", "Current yield only", "Simple interest payment"], "answer": 1, "explanation": "The chapter identifies yield to maturity (YTM) as the most accurate measure of interest rates."}, {"q": "What is present value analysis used to evaluate?", "options": ["Only the issuer's name", "The amount and timing of a debt instrument's cash flows", "Only the number of bondholders", "Only a firm's annual sales"], "answer": 1, "explanation": "Present value analysis compares the amount and timing of cash flows to determine a debt instrument's value and yield."}, {"q": "Why is one dollar received today generally worth more than one dollar received one year from now?", "options": ["Today's dollar can earn interest before the future date", "Future dollars are never accepted", "Inflation is always zero", "Today's dollar has no purchasing power"], "answer": 0, "explanation": "Money received today can be invested to earn interest, so it can grow by the future date."}, {"q": "What does loan principal mean?", "options": ["The interest rate charged each year", "The amount the lender provides to the borrower", "The date the loan is repaid", "The total number of payments"], "answer": 1, "explanation": "Loan principal is the amount of funds initially provided by the lender."}, {"q": "What is a loan's maturity date?", "options": ["The date interest is first calculated", "The date a borrower applies", "The date the loan must be repaid", "The date the lender is founded"], "answer": 2, "explanation": "The maturity date is when the loan is due to be repaid."}, {"q": "How is the simple interest rate defined in the chapter?", "options": ["Interest payment divided by loan principal", "Loan principal divided by the maturity date", "Total assets divided by liabilities", "Bond price divided by coupon payment"], "answer": 0, "explanation": "The simple interest rate is the interest payment divided by principal, conventionally expressed annually."}, {"q": "How does a simple loan generally repay the lender?", "options": ["Through equal monthly payments only", "With one amount equal to principal plus interest", "Through dividends from company shares", "Only by selling collateral"], "answer": 1, "explanation": "A simple loan requires one payment equal to the principal plus interest."}, {"q": "Which best describes a fixed-payment loan?", "options": ["A loan repaid only at maturity in one lump sum", "A loan with no interest", "A loan repaid through several equal-dollar payments over its term", "A loan whose payments change every day by definition"], "answer": 2, "explanation": "Fixed-payment loans repay principal and interest in several equal payments, often monthly."}, {"q": "Which is an example of a fixed-payment loan mentioned in the chapter?", "options": ["An auto loan", "A common share", "A perpetual consol bond only", "A currency deposit with no repayment terms"], "answer": 0, "explanation": "Auto loans and home mortgages are often fixed-payment installment loans."}, {"q": "Which list contains the four basic credit instruments discussed in the chapter?", "options": ["Stocks, options, futures, and currencies", "Simple loans, fixed-payment loans, coupon bonds, and discount bonds", "Checking accounts, savings accounts, shares, and insurance", "Mortgages, taxes, wages, and dividends"], "answer": 1, "explanation": "The chapter lists simple loans, fixed-payment loans, coupon bonds, and discount bonds."}, {"q": "What does yield to maturity equate for a debt instrument?", "options": ["Today's price and the present value of future payments", "A company's sales and its expenses", "A bank's deposits and its employees", "The coupon rate and inflation in every case"], "answer": 0, "explanation": "YTM is the interest rate that makes the present value of future payments equal to today's price."}, {"q": "What is a coupon bond?", "options": ["A bond that makes scheduled coupon payments and repays face value at maturity", "A loan that never pays interest", "A share that guarantees dividends", "A deposit account with no maturity"], "answer": 0, "explanation": "Coupon bonds pay periodic coupon interest and typically repay face value at maturity."}, {"q": "What is a consol, as described in the chapter?", "options": ["A bond with no coupon payments", "A bond with fixed coupon payments forever", "A one-year discount bond only", "A loan repaid in equal monthly installments"], "answer": 1, "explanation": "A consol is described as paying fixed coupon amounts forever."}, {"q": "What is the relationship between a bond's price and its yield to maturity?", "options": ["They always move in the same direction", "They are unrelated", "They are negatively related", "Both are fixed by the coupon rate alone"], "answer": 2, "explanation": "When the required yield rises, the present value of the bond's future cash flows falls, lowering its price."}, {"q": "When a coupon bond is priced at par, what is the relationship between YTM and coupon rate?", "options": ["YTM equals the coupon rate", "YTM is always zero", "YTM is always twice the coupon rate", "YTM is unrelated to the coupon rate"], "answer": 0, "explanation": "At par value, the chapter states that the yield to maturity equals the coupon rate."}, {"q": "If a coupon bond's price is below par value, how does its YTM compare with its coupon rate, according to the chapter?", "options": ["YTM is lower than the coupon rate", "YTM is greater than the coupon rate", "YTM must be zero", "YTM must equal inflation"], "answer": 1, "explanation": "The chapter states that yield is greater than the coupon rate when the bond price is below par."}, {"q": "What is a discount bond typically sold for at issue relative to its face value?", "options": ["Above face value", "Exactly twice face value", "Below face value", "At a price that cannot be stated"], "answer": 2, "explanation": "A discount bond is sold below face value and pays its face value at maturity."}, {"q": "What is current yield (CY) in relation to YTM?", "options": ["An easier-to-calculate approximation of YTM", "A guaranteed exact substitute for YTM in all cases", "The same thing as the bond's face value", "The real interest rate after inflation"], "answer": 0, "explanation": "The chapter describes current yield as an approximation of YTM that is easier to calculate."}, {"q": "When does current yield tend to be a good approximation of YTM, according to the chapter?", "options": ["When the bond price is near par and maturity is long", "Only when the bond has no coupon", "Only when inflation is negative", "Whenever the bond price is zero"], "answer": 0, "explanation": "The chapter notes that current yield is a good approximation when price is near par and maturity is long."}, {"q": "What is the real interest rate?", "options": ["The nominal interest rate plus expected inflation", "The nominal interest rate adjusted for expected changes in the price level", "The coupon payment divided by face value only", "The bond's market price"], "answer": 1, "explanation": "The chapter defines the real rate as the nominal rate adjusted for expected inflation."}, {"q": "Which formula for the real interest rate is shown in the chapter?", "options": ["Real rate = nominal rate + expected inflation", "Real rate = expected inflation − nominal rate", "Real rate = nominal rate − expected inflation", "Real rate = bond price ÷ face value"], "answer": 2, "explanation": "The chapter gives the approximate relationship ir = i − πe: nominal interest rate minus expected inflation."}, {"q": "If the nominal interest rate is 5% and expected inflation is 0%, what is the approximate real interest rate using the chapter's formula?", "options": ["5%", "0%", "−5%", "5.5%"], "answer": 0, "explanation": "Real rate = 5% − 0% = 5%."}, {"q": "If the nominal interest rate is 10% and expected inflation is 20%, what is the approximate real interest rate?", "options": ["30%", "10%", "−10%", "2%"], "answer": 2, "explanation": "Real rate = 10% − 20% = −10%."}, {"q": "When the real interest rate is low, what does the chapter say is generally encouraged?", "options": ["More borrowing and less lending", "Less borrowing and more lending", "No borrowing or lending", "Only foreign borrowing"], "answer": 0, "explanation": "A lower real rate makes borrowing less costly in real terms and generally reduces the incentive to lend."}, {"q": "What two components can be used to decompose a bond's rate of return in the chapter?", "options": ["Current yield and capital gains or losses", "Principal and maturity date only", "Inflation and taxes only", "Coupon rate and face value only"], "answer": 0, "explanation": "The chapter separates return into current yield and capital gains or losses."}, {"q": "Which bond has a return equal to its yield in the chapter's maturity discussion?", "options": ["A bond whose maturity equals the holding period", "Every bond held for one day", "Only a bond bought above par", "Every bond with a high coupon"], "answer": 0, "explanation": "The chapter's key finding says the return equals the yield when maturity equals the holding period."}, {"q": "For a bond with maturity longer than the investor's holding period, what can happen when interest rates rise?", "options": ["Its price can fall, causing a capital loss", "Its price must rise", "Its coupon payments stop permanently", "Its face value automatically increases"], "answer": 0, "explanation": "When rates rise, the present value and price of existing bonds fall; selling before maturity can realize a capital loss."}, {"q": "How does longer maturity generally affect a bond's price response to an interest-rate change?", "options": ["It makes the price less sensitive in every case", "It generally increases the price change associated with a rate change", "It prevents any price change", "It makes price depend only on inflation"], "answer": 1, "explanation": "The chapter states that the longer the maturity, the greater the price change associated with an interest-rate change."}, {"q": "What is reinvestment risk when holding a series of short-term bonds over a longer period?", "options": ["The risk that future interest rates available for reinvestment are uncertain", "The risk that bond face value doubles", "The risk that coupon bonds never pay interest", "The risk that inflation is always zero"], "answer": 0, "explanation": "Reinvestment risk arises because proceeds must be reinvested at future rates that may be higher or lower."}, {"q": "What can happen to an investor's return when market interest rates fall and short-term bond proceeds must be reinvested?", "options": ["Reinvestment may earn a lower rate", "Reinvestment is guaranteed to earn more", "Bond principal automatically increases", "The investor no longer faces any risk"], "answer": 0, "explanation": "When rates fall, maturing funds may have to be reinvested at lower rates, reducing future income."}];const quiz=document.getElementById('quiz'),results=document.getElementById('results'),submitBtn=document.getElementById('submitBtn');
function render(){quiz.innerHTML='';results.innerHTML='';results.classList.add('hidden');submitBtn.disabled=false;questions.forEach((q,i)=>{const s=document.createElement('section');s.className='question';s.id='q'+i;const t=document.createElement('div');t.className='qtitle';t.textContent=(i+1)+'. '+q.q;s.appendChild(t);q.options.forEach((o,j)=>{const l=document.createElement('label');l.className='option';const r=document.createElement('input');r.type='radio';r.name='q'+i;r.value=j;r.addEventListener('change',updateProgress);const txt=document.createElement('span');txt.textContent=String.fromCharCode(65+j)+'. '+o;const m=document.createElement('span');m.className='mark';m.dataset.mark='1';l.append(r,txt,m);s.appendChild(l)});quiz.appendChild(s)});updateProgress()}
function updateProgress(){let n=0;questions.forEach((q,i)=>{if(document.querySelector('input[name="q'+i+'"]:checked'))n++});document.getElementById('progressText').textContent=n+' of '+questions.length+' answered';document.getElementById('bar').style.width=(n/questions.length*100)+'%'}
submitBtn.addEventListener('click',()=>{let score=0,blank=0;questions.forEach((q,i)=>{const c=document.querySelector('input[name="q'+i+'"]:checked'),sel=c?Number(c.value):-1;if(sel<0)blank++;if(sel===q.answer)score++;document.getElementById('q'+i).querySelectorAll('.option').forEach((l,j)=>{l.classList.remove('correct','incorrect');const m=l.querySelector('[data-mark]');m.textContent='';m.className='mark';if(j===q.answer){l.classList.add('correct');m.textContent='✓ Correct answer';m.classList.add('green')}if(j===sel&&sel!==q.answer){l.classList.add('incorrect');m.textContent='✗ Your answer';m.classList.add('red')}l.querySelector('input').disabled=true})});results.innerHTML='<h2>Your Results</h2><div class="score">'+score+' / '+questions.length+' ('+Math.round(score/questions.length*100)+'%)</div><p><span class="pill '+(score/questions.length>=.5?'pass':'fail')+'">'+(score/questions.length>=.5?'Good work—keep revising!':'Keep practicing—you can improve!')+'</span></p><p>You left '+blank+' question(s) unanswered. The review below shows every correct answer and explanation.</p>';questions.forEach((q,i)=>{const c=document.querySelector('input[name="q'+i+'"]:checked'),sel=c?Number(c.value):-1;const row=document.createElement('div');row.className='resultrow';const h=document.createElement('strong');h.textContent=(i+1)+'. '+q.q;row.appendChild(h);const st=document.createElement('span');st.className='pill '+(sel===q.answer?'pass':'fail');st.textContent=sel===q.answer?'✓ Correct':'✗ Incorrect / unanswered';row.appendChild(st);const yours=document.createElement('div');yours.textContent='Your answer: '+(sel<0?'Not answered':q.options[sel]);row.appendChild(yours);const correct=document.createElement('div');const b=document.createElement('b');b.className='green';b.textContent='✓ Correct answer: ';correct.append(b,document.createTextNode(String.fromCharCode(65+q.answer)+'. '+q.options[q.answer]));row.appendChild(correct);const ex=document.createElement('div');ex.className='muted';ex.textContent='Explanation: '+q.explanation;row.appendChild(ex);results.appendChild(row)});results.classList.remove('hidden');submitBtn.disabled=true;results.scrollIntoView({behavior:'smooth',block:'start'})});document.getElementById('resetBtn').addEventListener('click',render);render();
</script></body></html>
